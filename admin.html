<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sheko0o Madrid — Private</title>
<style>
:root{--bg:#090909;--p:#131313;--p2:#191919;--line:#2c2c2c;--gold:#ff9f1a;--gold2:#ffc45a;--text:#fff;--muted:#aaa;--ok:#35c77a;--red:#ff6262}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0%,rgba(255,159,26,.08),transparent 28%),var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}.wrap{width:min(1200px,calc(100% - 24px));margin:auto}.top{min-height:70px;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;font-size:21px}.brand span{color:var(--gold)}button,input,select,textarea{font:inherit}.btn{border:1px solid #3b3b3b;background:#171717;color:#fff;border-radius:10px;padding:10px 14px;cursor:pointer}.primary{background:linear-gradient(135deg,#ffb12d,#d97900);color:#160e04;border:0;font-weight:900}.danger{color:#fff;background:#351313;border-color:#6d2424}.login{min-height:100vh;display:grid;place-items:center}.box{width:min(440px,calc(100% - 24px));background:#131313;border:1px solid #2c2c2c;border-radius:20px;padding:25px;box-shadow:0 20px 70px #000}.field{width:100%;background:#0d0d0d;border:1px solid #303030;color:#fff;border-radius:10px;padding:12px;margin:6px 0}.field:focus{outline:1px solid var(--gold)}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.stat{background:linear-gradient(145deg,#181818,#101010);border:1px solid #2b2b2b;border-radius:15px;padding:17px}.stat b{display:block;font-size:26px;color:var(--gold2)}.stat span{color:#aaa;font-size:13px}.panel{background:#121212;border:1px solid #292929;border-radius:17px;padding:17px;margin:14px 0}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.full{grid-column:1/-1}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:10px;border-bottom:1px solid #292929;text-align:right;vertical-align:middle}.muted{color:#999;font-size:12px}.actions{display:flex;gap:6px;flex-wrap:wrap}.pill{display:inline-block;border-radius:999px;padding:4px 9px;background:#251a0c;color:var(--gold2);font-size:11px}.notice{background:#17120c;border:1px solid #4a3217;padding:12px;border-radius:12px;color:#ddd;font-size:13px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:#171717;border:1px solid #6a4718;padding:11px 18px;border-radius:11px;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}}@media(max-width:460px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;padding:12px 0;flex-direction:column}}
</style>
</head>
<body>
<!--
SUPABASE SQL SETUP — run once in Supabase SQL Editor.

create extension if not exists pgcrypto;
create table if not exists public.products(
 id uuid primary key default gen_random_uuid(), name text not null, category text not null,
 image_url text default '', price numeric(12,2) not null default 0, old_price numeric(12,2),
 description text default '', available boolean not null default true, featured boolean not null default false,
 enabled boolean not null default true, orders_count integer not null default 0,
 created_at timestamptz not null default now(), updated_at timestamptz not null default now()
);
create table if not exists public.orders(
 id uuid primary key default gen_random_uuid(), customer_name text not null, customer_phone text not null,
 items jsonb not null, total numeric(12,2) not null, notes text default '',
 status text not null default 'pending', created_at timestamptz not null default now()
);
create table if not exists public.store_settings(
 id integer primary key default 1, store_name text default 'Sheko0o Madrid',
 whatsapp text default '+20 10 14138243', description text default '',
 announcement text default '', updated_at timestamptz not null default now()
);
insert into public.store_settings(id) values(1) on conflict(id) do nothing;

alter table public.products enable row level security;
alter table public.orders enable row level security;
alter table public.store_settings enable row level security;

create policy "public read enabled products" on public.products for select using (enabled=true);
create policy "public read settings" on public.store_settings for select using (true);
create policy "public insert orders" on public.orders for insert with check (true);

-- After creating your first Auth user, replace AUTH_USER_UUID below with that user's UUID.
create policy "admin all products" on public.products for all to authenticated using (auth.uid()='AUTH_USER_UUID') with check (auth.uid()='AUTH_USER_UUID');
create policy "admin all orders" on public.orders for all to authenticated using (auth.uid()='AUTH_USER_UUID') with check (auth.uid()='AUTH_USER_UUID');
create policy "admin all settings" on public.store_settings for all to authenticated using (auth.uid()='AUTH_USER_UUID') with check (auth.uid()='AUTH_USER_UUID');

alter publication supabase_realtime add table public.products;
alter publication supabase_realtime add table public.store_settings;
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<div id="login" class="login"><div class="box"><div class="brand">Sheko0o <span>Madrid</span></div><h1>الدخول الخاص</h1><p class="muted">هذه الصفحة منفصلة عن المتجر.</p><input id="email" class="field" type="email" placeholder="البريد الإلكتروني"><input id="password" class="field" type="password" placeholder="كلمة المرور"><button class="btn primary" style="width:100%;margin-top:8px" id="loginBtn">دخول</button><div id="loginMsg" class="muted" style="margin-top:10px"></div></div></div>

<div id="app" class="hidden"><header><div class="wrap top"><div class="brand">Sheko0o <span>Madrid</span></div><div class="actions"><button class="btn" id="refresh">تحديث</button><button class="btn" id="logout">خروج</button></div></div></header>
<main class="wrap">
<div class="grid"><div class="stat"><b id="sProducts">0</b><span>إجمالي المنتجات</span></div><div class="stat"><b id="sOrders">0</b><span>إجمالي الطلبات</span></div><div class="stat"><b id="sPending">0</b><span>قيد المراجعة</span></div><div class="stat"><b id="sDone">0</b><span>مكتملة</span></div></div>
<div class="panel"><div class="panel-head"><h2>المنتجات</h2><button class="btn primary" id="newProduct">إضافة منتج</button></div><div class="notice" style="margin:10px 0">التغييرات تُحفظ مباشرة في قاعدة البيانات.</div><div class="table-wrap"><table class="table"><thead><tr><th>المنتج</th><th>القسم</th><th>السعر</th><th>التوفر</th><th>إجراء</th></tr></thead><tbody id="productsBody"></tbody></table></div></div>
<div class="panel"><div class="panel-head"><h2>الطلبات</h2><input id="orderSearch" class="field" style="max-width:300px;margin:0" placeholder="بحث بالاسم أو الهاتف"></div><div class="table-wrap"><table class="table"><thead><tr><th>رقم الطلب</th><th>العميل</th><th>الإجمالي</th><th>التاريخ</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="ordersBody"></tbody></table></div></div>
<div class="panel"><div class="panel-head"><h2>إعدادات المتجر</h2><span id="saveState" class="pill">جاهز</span></div><div class="formgrid"><input id="setName" class="field" placeholder="اسم المتجر"><input id="setWa" class="field" placeholder="رقم واتساب"><input id="setDesc" class="field full" placeholder="وصف المتجر"><textarea id="setAnnouncement" class="field full" rows="3" placeholder="الإعلان"></textarea><button class="btn primary full" id="saveSettings">حفظ الإعدادات</button></div></div>
</main></div>
<div class="toast" id="toast"></div>

<script>
/* ===== PUBLIC SUPABASE CONFIG — SAME VALUES AS index.html ===== */
const SUPABASE_URL="YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY="YOUR_SUPABASE_ANON_OR_PUBLISHABLE_KEY";
/* ============================================================ */
const configured=()=>SUPABASE_URL.startsWith("http")&&!SUPABASE_ANON_KEY.includes("YOUR_");
let sb=configured()?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null,products=[],orders=[],editing=null;
const $=s=>document.querySelector(s);
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2200)}
function money(n){return Number(n||0).toLocaleString("ar-EG")+" جنيه"}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function start(){if(!sb){$("#loginMsg").textContent="ضع إعدادات Supabase في أعلى الملف أولًا.";return}const {data:{session}}=await sb.auth.getSession();session?showApp():null;sb.auth.onAuthStateChange((_e,s)=>s?showApp():location.reload())}
async function login(){if(!sb)return;$("#loginMsg").textContent="جاري الدخول...";const {error}=await sb.auth.signInWithPassword({email:$("#email").value.trim(),password:$("#password").value});if(error)$("#loginMsg").textContent=error.message}
async function showApp(){ $("#login").classList.add("hidden");$("#app").classList.remove("hidden");await loadAll();subscribe() }
async function loadAll(){const [p,o,s]=await Promise.all([sb.from("products").select("*").order("created_at",{ascending:false}),sb.from("orders").select("*").order("created_at",{ascending:false}),sb.from("store_settings").select("*").limit(1).maybeSingle()]);if(p.error||o.error){toast("تحقق من سياسات قاعدة البيانات")}products=p.data||[];orders=o.data||[];if(s.data){$("#setName").value=s.data.store_name||"";$("#setWa").value=s.data.whatsapp||"";$("#setDesc").value=s.data.description||"";$("#setAnnouncement").value=s.data.announcement||""}render()}
function render(){ $("#sProducts").textContent=products.length;$("#sOrders").textContent=orders.length;$("#sPending").textContent=orders.filter(x=>x.status==="pending").length;$("#sDone").textContent=orders.filter(x=>x.status==="completed").length;
$("#productsBody").innerHTML=products.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="muted">${esc(p.description||"")}</div></td><td><span class="pill">${esc(p.category)}</span></td><td>${money(p.price)}</td><td>${p.available?"متوفر":"متوقف"}</td><td><div class="actions"><button class="btn" onclick="editProduct('${p.id}')">تعديل</button><button class="btn danger" onclick="deleteProduct('${p.id}')">حذف</button></div></td></tr>`).join("")||`<tr><td colspan="5" class="muted">لا توجد منتجات.</td></tr>`;
 const q=$("#orderSearch").value.trim().toLowerCase();const os=orders.filter(o=>(o.customer_name+" "+o.customer_phone).toLowerCase().includes(q));$("#ordersBody").innerHTML=os.map(o=>`<tr><td>${esc(String(o.id).slice(0,8))}</td><td><b>${esc(o.customer_name)}</b><div class="muted">${esc(o.customer_phone)}</div></td><td>${money(o.total)}</td><td>${new Date(o.created_at).toLocaleString("ar-EG")}</td><td><select class="field" style="margin:0" onchange="changeStatus('${o.id}',this.value)"><option value="pending" ${o.status==="pending"?"selected":""}>قيد المراجعة</option><option value="processing" ${o.status==="processing"?"selected":""}>جاري التنفيذ</option><option value="completed" ${o.status==="completed"?"selected":""}>مكتمل</option><option value="cancelled" ${o.status==="cancelled"?"selected":""}>ملغي</option></select></td><td><button class="btn" onclick='viewOrder(${JSON.stringify(o.id)})'>عرض</button></td></tr>`).join("")||`<tr><td colspan="6" class="muted">لا توجد طلبات.</td></tr>`}
function productForm(p={}){const cats=["OSM Coins","OSM Money","PES / eFootball","Offers"];const v=x=>esc(p[x]??"");const html=`<div class="box" style="width:min(650px,100%);max-height:90vh;overflow:auto"><h2>${p.id?"تعديل منتج":"إضافة منتج"}</h2><div class="formgrid"><input id="pName" class="field" placeholder="اسم المنتج" value="${v("name")}"><select id="pCat" class="field">${cats.map(c=>`<option ${p.category===c?"selected":""}>${c}</option>`).join("")}</select><input id="pPrice" class="field" type="number" min="0" step="0.01" placeholder="السعر" value="${v("price")}"><input id="pOld" class="field" type="number" min="0" step="0.01" placeholder="السعر القديم" value="${v("old_price")}"><input id="pImage" class="field full" placeholder="رابط صورة المنتج" value="${v("image_url")}"><textarea id="pDesc" class="field full" rows="3" placeholder="الوصف">${v("description")}</textarea><label class="field"><input id="pAvail" type="checkbox" ${p.available!==false?"checked":""}> متوفر</label><label class="field"><input id="pFeatured" type="checkbox" ${p.featured?"checked":""}> منتج مميز</label><button class="btn" id="cancelP">إلغاء</button><button class="btn primary" id="saveP">حفظ</button></div></div>`;const ov=document.createElement("div");ov.className="login";ov.style.cssText="position:fixed;inset:0;background:#000b;z-index:20";ov.innerHTML=html;document.body.appendChild(ov);$("#cancelP").onclick=()=>ov.remove();$("#saveP").onclick=async()=>{const data={name:$("#pName").value.trim(),category:$("#pCat").value,price:Number($("#pPrice").value),old_price:$("#pOld").value?Number($("#pOld").value):null,image_url:$("#pImage").value.trim(),description:$("#pDesc").value.trim(),available:$("#pAvail").checked,featured:$("#pFeatured").checked,enabled:true,updated_at:new Date().toISOString()};if(!data.name||data.price<0){toast("أكمل بيانات المنتج");return}$("#saveP").disabled=true;$("#saveP").textContent="جاري الحفظ...";const r=p.id?await sb.from("products").update(data).eq("id",p.id):await sb.from("products").insert(data);if(r.error){toast("فشل الحفظ: "+r.error.message);$("#saveP").disabled=false;return}ov.remove();toast("تم الحفظ");loadAll()}}
window.editProduct=id=>productForm(products.find(p=>p.id===id)||{});window.deleteProduct=async id=>{if(!confirm("تأكيد حذف المنتج؟"))return;const r=await sb.from("products").delete().eq("id",id);r.error?toast("فشل الحذف"):toast("تم الحذف");loadAll()};window.changeStatus=async(id,status)=>{const r=await sb.from("orders").update({status}).eq("id",id);r.error?toast("فشل تحديث الحالة"):toast("تم الحفظ");loadAll()};window.viewOrder=id=>{const o=orders.find(x=>x.id===id);if(!o)return;alert(`العميل: ${o.customer_name}\nالهاتف: ${o.customer_phone}\nالإجمالي: ${money(o.total)}\n\n${(o.items||[]).map(x=>`${x.name} × ${x.quantity} — ${money(x.price*x.quantity)}`).join("\n")}\n\nملاحظات: ${o.notes||"لا توجد"}`)}
async function saveSettings(){const data={id:1,store_name:$("#setName").value.trim(),whatsapp:$("#setWa").value.trim(),description:$("#setDesc").value.trim(),announcement:$("#setAnnouncement").value.trim(),updated_at:new Date().toISOString()};$("#saveState").textContent="جاري الحفظ...";const r=await sb.from("store_settings").upsert(data);$("#saveState").textContent=r.error?"فشل الحفظ":"تم الحفظ";if(!r.error)toast("تم الحفظ")}
function subscribe(){sb.channel("admin-live").on("postgres_changes",{event:"*",schema:"public",table:"products"},loadAll).on("postgres_changes",{event:"*",schema:"public",table:"orders"},loadAll).on("postgres_changes",{event:"*",schema:"public",table:"store_settings"},loadAll).subscribe()}
$("#loginBtn").onclick=login;$("#password").onkeydown=e=>e.key==="Enter"&&login();$("#logout").onclick=()=>sb.auth.signOut();$("#refresh").onclick=loadAll;$("#newProduct").onclick=()=>productForm();$("#saveSettings").onclick=saveSettings;$("#orderSearch").oninput=render;start();
</script>
</body>
</html>
